name: Museum Exhibit Automation (Every 3 Days)

on:
  schedule:
    # 01:00 UTC = 09:00 UTC+8 (台灣/台北時間 每 3 天早上 9 點)
    - cron: '0 1 */3 * *'
  workflow_dispatch: # 支援在 GitHub 介面或指令手動一鍵測試執行

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Curate New Exhibit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: flare
        run: python .github/scripts/curate_daily.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-curate: Exhibit update (every 3 days) [skip ci]"
            git push
          fi
