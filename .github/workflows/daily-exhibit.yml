name: Museum Exhibit Automation
on:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: museum-publication
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r automation/requirements.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Prepare due exhibit and reserve allowance
        if: github.event_name != 'push'
        env:
          MUSEUM_PAID_ENABLED: ${{ vars.MUSEUM_PAID_ENABLED }}
        run: python .github/scripts/pipeline.py prepare
      - name: Persist reservation before any paid request
        run: bash .github/scripts/commit.sh
      - name: Generate exactly one approved image
        if: github.event_name != 'push'
        env:
          MUSEUM_PAID_ENABLED: ${{ vars.MUSEUM_PAID_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/pipeline.py generate
      - name: Preserve generated result for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: museum-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            automation/state.json
            images/
          retention-days: 30
      - name: Persist image before rendering
        run: bash .github/scripts/commit.sh
      - name: Render completed exhibit
        run: python .github/scripts/pipeline.py render
      - name: Persist staged publication
        run: bash .github/scripts/commit.sh
      - name: Build public-only artifact
        run: python .github/scripts/pipeline.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python .github/scripts/pipeline.py verify "$PAGE_URL"
      - name: Record verified publication
        run: python .github/scripts/pipeline.py finalize
      - name: Persist success clock
        run: bash .github/scripts/commit.sh
      - name: Failure notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Museum automation needs attention';
            const body = `Publication failed. Existing verified success date is unchanged. Inspect the run before retrying a paid request.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({...context.repo, state: 'open', creator: 'github-actions[bot]'});
            const found = issues.data.find(i => i.title === title);
            if (found) await github.rest.issues.createComment({...context.repo, issue_number: found.number, body});
            else await github.rest.issues.create({...context.repo, title, body, assignees: [context.repo.owner]});
